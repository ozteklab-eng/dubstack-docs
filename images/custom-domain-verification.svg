<svg width="960" height="520" viewBox="0 0 960 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Custom domain verification settings</title>
  <desc id="desc">Illustration of a custom domain panel with pending verification, TXT record, and CNAME target.</desc>
  <rect width="960" height="520" rx="28" fill="#0B0F12"/>
  <rect x="48" y="48" width="864" height="424" rx="24" fill="#11171A" stroke="#263238"/>
  <rect x="80" y="80" width="800" height="72" rx="16" fill="#151D21" stroke="#2A363B"/>
  <circle cx="116" cy="116" r="18" fill="#07C983" fill-opacity="0.18" stroke="#07C983"/>
  <path d="M107 116.5L113.5 123L126 109" stroke="#07C983" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="152" y="110" fill="#F4F7F6" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">dubstack.ai/docs</text>
  <text x="152" y="135" fill="#A7B3B8" font-family="Inter, Arial, sans-serif" font-size="15">Path-based custom domain</text>
  <rect x="716" y="98" width="132" height="36" rx="18" fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B" stroke-opacity="0.65"/>
  <text x="745" y="121" fill="#FBBF24" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650">Pending</text>
  <text x="80" y="205" fill="#F4F7F6" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Routing identities</text>
  <rect x="80" y="228" width="800" height="64" rx="14" fill="#0F1518" stroke="#263238"/>
  <text x="108" y="255" fill="#A7B3B8" font-family="Inter, Arial, sans-serif" font-size="13">Public URL</text>
  <text x="108" y="277" fill="#F4F7F6" font-family="JetBrains Mono, monospace" font-size="15">https://dubstack.ai/docs</text>
  <text x="512" y="255" fill="#A7B3B8" font-family="Inter, Arial, sans-serif" font-size="13">Origin target</text>
  <text x="512" y="277" fill="#F4F7F6" font-family="JetBrains Mono, monospace" font-size="15">site--origin.dubstack.live</text>
  <text x="80" y="336" fill="#F4F7F6" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">DNS verification</text>
  <rect x="80" y="360" width="800" height="72" rx="14" fill="#0F1518" stroke="#263238"/>
  <text x="108" y="387" fill="#A7B3B8" font-family="Inter, Arial, sans-serif" font-size="13">TXT record</text>
  <text x="108" y="412" fill="#F4F7F6" font-family="JetBrains Mono, monospace" font-size="15">_dubstack-challenge.dubstack.ai</text>
  <rect x="572" y="382" width="248" height="32" rx="8" fill="#151D21" stroke="#2A363B"/>
  <text x="592" y="403" fill="#07C983" font-family="JetBrains Mono, monospace" font-size="14">dubstack-verify=...</text>
</svg>
